name: Build Biss OS ISO

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          git \
          squashfs-tools \
          xorriso \
          isolinux \
          syslinux \
          grub-pc-bin \
          grub-efi-amd64-bin \
          mtools \
          dosfstools

    # If the project has its own setup script, run it here
    - name: Prepare build environment
      run: |
        chmod +x *.sh || true

    # Main build step – CHANGE this if Biss OS uses a different command
    - name: Build ISO
      run: |
        if [ -f build.sh ]; then
          ./build.sh
        elif [ -f make_iso.sh ]; then
          ./make_iso.sh
        else
          echo "No build script found. Trying generic make..."
          make
        fi

    # Upload the generated ISO file
    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: biss-os-iso
        path: |
          **/*.iso
