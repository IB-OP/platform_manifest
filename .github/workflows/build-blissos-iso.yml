name: Build BlissOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_MANIFEST_URL: https://github.com/IB-OP/platform_manifest.git
      REPO_MANIFEST_BRANCH: typhoon-x86
      BUILD_TARGET: bliss_x86_64-userdebug
      BUILD_DIR: ${{ github.workspace }}/blissos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt update
        sudo apt install -y \
          git-core gnupg flex bison gperf build-essential zip curl \
          zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev \
          ccache libgl1-mesa-dev libxml2-utils xsltproc unzip \
          squashfs-tools python3-mako libssl-dev ninja-build \
          lunzip syslinux syslinux-utils gettext genisoimage bc \
          xorriso xmlstarlet nasm zstd

    - name: Install writable local repo binary
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod +x ~/.bin/repo
        ~/.bin/repo --version

    - name: Setup Android repo
      run: |
        mkdir -p $BUILD_DIR
        cd $BUILD_DIR

        # Use local repo binary explicitly to avoid freeze
        ~/.bin/repo init -u $REPO_MANIFEST_URL -b $REPO_MANIFEST_BRANCH --git-lfs
        ~/.bin/repo sync -c --force-sync --no-tags --no-clone-bundle -j$(nproc)

    - name: Prepare build environment
      run: |
        cd $BUILD_DIR
        source build/envsetup.sh
        lunch $BUILD_TARGET

    - name: Build ISO
      run: |
        cd $BUILD_DIR
        make iso_img -j$(nproc)

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: blissos-iso
        path: $BUILD_DIR/out/target/product/*/*.iso
